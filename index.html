<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hand Physics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Hand Physics</h1>
    <p id="status">Click "Start camera" to use your hand, or just use your mouse.</p>
    <div class="controls">
      <button id="startCam">Start camera</button>
      <button id="reset">Reset level</button>
    </div>
  </header>

  <main id="stage">
    <!-- Mirrored webcam feed sits behind the physics canvas -->
    <video id="video" playsinline muted></video>
    <canvas id="world"></canvas>
    <div id="goalText"></div>
  </main>

  <footer>Pinch thumb + index to grab · open hand to release/throw · stack above the line for 3s to win</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
